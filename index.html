<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guru Kripa Tour & Travels | Gaya, Bihar</title>
    <meta name="description" content="Guru Kripa Tour & Travels - Scorpio, Ertiga, Dzire, Innova, Innova Crysta booking. Gaya Bihar se kahi bhi. Best rates!">
    <meta name="keywords" content="tour travels gaya bihar, cab booking gaya, innova crysta gaya, taxi service bihar">
    <meta property="og:title" content="Guru Kripa Tour & Travels | Gaya Bihar">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{
            --primary:#FF6B00;
            --primary-dark:#E55A00;
            --primary-glow:rgba(255,107,0,0.3);
            --secondary:#1A1A2E;
            --dark:#0F0F1A;
            --card-bg:#16162A;
            --card-border:rgba(255,107,0,0.15);
            --text:#FFFFFF;
            --text-dim:#8888AA;
            --success:#00C853;
            --glass:rgba(255,255,255,0.05)
        }
        html{scroll-behavior:smooth}
        body{
            font-family:'Poppins',sans-serif;
            background:var(--dark);
            color:var(--text);
            overflow-x:hidden;
            -webkit-font-smoothing:antialiased
        }
        ::-webkit-scrollbar{width:6px}
        ::-webkit-scrollbar-track{background:var(--dark)}
        ::-webkit-scrollbar-thumb{background:var(--primary);border-radius:3px}

        .loader{
            position:fixed;top:0;left:0;width:100%;height:100%;
            background:var(--dark);display:flex;align-items:center;
            justify-content:center;z-index:10000;
            transition:opacity 0.5s,visibility 0.5s
        }
        .loader.hidden{opacity:0;visibility:hidden}
        .loader-content{text-align:center}
        .loader-wheel{
            width:60px;height:60px;
            border:4px solid rgba(255,107,0,0.2);
            border-top-color:var(--primary);
            border-radius:50%;
            animation:spin 0.8s linear infinite;
            margin:0 auto 16px
        }
        .loader-text{font-size:14px;color:var(--primary);font-weight:600;letter-spacing:2px}
        @keyframes spin{to{transform:rotate(360deg)}}

        .nav{
            position:fixed;top:0;left:0;right:0;z-index:1000;
            padding:12px 20px;transition:all 0.3s;background:transparent
        }
        .nav.scrolled{
            background:rgba(15,15,26,0.95);
            backdrop-filter:blur(20px);
            box-shadow:0 2px 30px rgba(0,0,0,0.5)
        }
        .nav-inner{
            max-width:1200px;margin:0 auto;display:flex;
            align-items:center;justify-content:space-between
        }
        .logo{display:flex;align-items:center;gap:10px;text-decoration:none}
        .logo-icon{
            width:44px;height:44px;background:var(--primary);
            border-radius:12px;display:flex;align-items:center;
            justify-content:center;font-size:22px;font-weight:900;
            color:white;box-shadow:0 4px 15px var(--primary-glow);
            overflow:hidden
        }
        .logo-icon img{width:100%;height:100%;object-fit:cover;border-radius:12px}
        .logo-text{font-size:16px;font-weight:700;color:white;line-height:1.2}
        .logo-text span{
            display:block;font-size:10px;color:var(--primary);
            font-weight:600;letter-spacing:1.5px
        }
        .nav-call{
            display:flex;align-items:center;gap:8px;
            background:var(--primary);color:white;text-decoration:none;
            padding:10px 20px;border-radius:50px;font-weight:700;
            font-size:14px;box-shadow:0 4px 15px var(--primary-glow);
            transition:transform 0.2s
        }
        .nav-call:hover{transform:scale(1.05)}

        .hero{
            min-height:100vh;display:flex;align-items:center;
            justify-content:center;position:relative;
            padding:100px 20px 60px;overflow:hidden
        }
        .hero-bg{position:absolute;top:0;left:0;width:100%;height:100%;z-index:0}
        .hero-bg::before{
            content:'';position:absolute;top:-50%;left:-50%;
            width:200%;height:200%;
            background:radial-gradient(circle at 30% 40%,rgba(255,107,0,0.08) 0%,transparent 50%),
            radial-gradient(circle at 70% 60%,rgba(255,107,0,0.05) 0%,transparent 50%);
            animation:bgFloat 20s ease-in-out infinite
        }
        @keyframes bgFloat{
            0%,100%{transform:translate(0,0)}
            50%{transform:translate(-30px,-20px)}
        }
        .road-line{
            position:absolute;bottom:0;left:0;width:100%;height:4px;
            background:repeating-linear-gradient(90deg,var(--primary) 0px,var(--primary) 30px,transparent 30px,transparent 60px);
            animation:roadMove 1s linear infinite;opacity:0.5
        }
        @keyframes roadMove{to{background-position:60px 0}}
        .hero-content{position:relative;z-index:1;text-align:center;max-width:700px}
        .hero-banner{
            width:100%;max-width:600px;margin:0 auto 24px;
            border-radius:20px;overflow:hidden;
            border:2px solid var(--card-border)
        }
        .hero-banner img{width:100%;height:auto;display:block}
        .hero-badge{
            display:inline-flex;align-items:center;gap:8px;
            background:rgba(255,107,0,0.1);
            border:1px solid rgba(255,107,0,0.3);
            padding:8px 18px;border-radius:50px;font-size:13px;
            font-weight:600;color:var(--primary);margin-bottom:24px;
            animation:fadeUp 0.8s ease
        }
        .hero-badge .dot{
            width:8px;height:8px;background:var(--success);
            border-radius:50%;animation:pulse 1.5s infinite
        }
        @keyframes pulse{
            0%,100%{opacity:1;transform:scale(1)}
            50%{opacity:0.5;transform:scale(1.3)}
        }
        .hero-title{
            font-size:clamp(32px,7vw,56px);font-weight:900;
            line-height:1.1;margin-bottom:16px;
            animation:fadeUp 0.8s ease 0.1s both
        }
        .hero-title .highlight{
            background:linear-gradient(135deg,var(--primary),#FFB800);
            -webkit-background-clip:text;-webkit-text-fill-color:transparent;
            background-clip:text
        }
        .hero-sub{
            font-size:16px;color:var(--text-dim);margin-bottom:32px;
            line-height:1.6;animation:fadeUp 0.8s ease 0.2s both
        }
        .hero-actions{
            display:flex;gap:14px;justify-content:center;
            flex-wrap:wrap;animation:fadeUp 0.8s ease 0.3s both
        }
        .btn{
            display:inline-flex;align-items:center;gap:10px;
            padding:16px 32px;border-radius:16px;font-size:16px;
            font-weight:700;text-decoration:none;transition:all 0.3s;
            cursor:pointer;border:none;font-family:inherit
        }
        .btn-primary{
            background:var(--primary);color:white;
            box-shadow:0 8px 30px var(--primary-glow)
        }
        .btn-primary:hover{
            transform:translateY(-3px);
            box-shadow:0 12px 40px rgba(255,107,0,0.4)
        }
        .btn-ghost{
            background:var(--glass);color:white;
            border:1px solid rgba(255,255,255,0.1)
        }
        .btn-ghost:hover{
            background:rgba(255,255,255,0.1);transform:translateY(-3px)
        }
        .hero-stats{
            display:flex;gap:30px;justify-content:center;
            margin-top:48px;animation:fadeUp 0.8s ease 0.4s both
        }
        .stat{text-align:center}
        .stat-num{font-size:28px;font-weight:900;color:var(--primary)}
        .stat-label{
            font-size:11px;color:var(--text-dim);
            text-transform:uppercase;letter-spacing:1px
        }
        @keyframes fadeUp{
            from{opacity:0;transform:translateY(30px)}
            to{opacity:1;transform:translateY(0)}
        }

        section{padding:80px 20px}
        .section-header{text-align:center;margin-bottom:50px}
        .section-tag{
            font-size:12px;font-weight:700;color:var(--primary);
            text-transform:uppercase;letter-spacing:3px;margin-bottom:12px
        }
        .section-title{font-size:clamp(24px,5vw,36px);font-weight:800}

        .vehicles{max-width:1200px;margin:0 auto}
        .vehicle-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
            gap:20px
        }
        .vehicle-card{
            background:var(--card-bg);border:1px solid var(--card-border);
            border-radius:20px;overflow:hidden;
            transition:transform 0.3s,box-shadow 0.3s;
            cursor:pointer;position:relative
        }
        .vehicle-card:hover{
            transform:translateY(-8px);
            box-shadow:0 20px 50px rgba(255,107,0,0.15)
        }
        .vehicle-visual{
            height:180px;display:flex;align-items:center;
            justify-content:center;position:relative;overflow:hidden
        }
        .vehicle-visual img{width:100%;height:100%;object-fit:cover}
        .vehicle-visual .emoji-fallback{font-size:80px}
        .vehicle-visual::after{
            content:'';position:absolute;bottom:0;left:0;
            width:100%;height:50%;
            background:linear-gradient(to top,var(--card-bg),transparent)
        }
        .vehicle-info{padding:20px}
        .vehicle-name{font-size:20px;font-weight:800;margin-bottom:4px}
        .vehicle-type{font-size:12px;color:var(--text-dim);margin-bottom:16px}
        .vehicle-specs{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
        .spec{
            display:flex;align-items:center;gap:6px;
            background:rgba(255,255,255,0.05);padding:6px 12px;
            border-radius:8px;font-size:12px;color:var(--text-dim)
        }
        .vehicle-price{display:flex;align-items:baseline;gap:4px;margin-bottom:16px}
        .price-amount{font-size:24px;font-weight:900;color:var(--primary)}
        .price-unit{font-size:12px;color:var(--text-dim)}
        .vehicle-book{
            width:100%;padding:14px;background:var(--primary);color:white;
            border:none;border-radius:12px;font-size:15px;font-weight:700;
            cursor:pointer;font-family:inherit;transition:background 0.3s
        }
        .vehicle-book:hover{background:var(--primary-dark)}

        .calc-section{max-width:800px;margin:0 auto}
        .calc-box{
            background:var(--card-bg);border:1px solid var(--card-border);
            border-radius:24px;padding:32px;position:relative;overflow:hidden
        }
        .calc-box::before{
            content:'';position:absolute;top:0;left:0;width:100%;height:3px;
            background:linear-gradient(90deg,var(--primary),#FFB800,var(--primary))
        }
        .calc-form{display:grid;gap:20px}
        .calc-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
        .input-group{display:flex;flex-direction:column;gap:6px}
        .input-group label{
            font-size:12px;font-weight:600;color:var(--text-dim);
            text-transform:uppercase;letter-spacing:1px
        }
        .input-group input,
        .input-group select{
            background:rgba(255,255,255,0.05);
            border:1px solid rgba(255,255,255,0.1);
            padding:14px 16px;border-radius:12px;color:white;
            font-size:15px;font-family:inherit;outline:none;
            transition:border-color 0.3s
        }
        .input-group input:focus,
        .input-group select:focus{border-color:var(--primary)}
        .input-group select option{background:var(--secondary);color:white}
        .input-group input::placeholder{color:rgba(255,255,255,0.3)}
        .trip-toggle{
            display:flex;background:rgba(255,255,255,0.05);
            border-radius:12px;overflow:hidden;
            border:1px solid rgba(255,255,255,0.1)
        }
        .trip-btn{
            flex:1;padding:14px;background:transparent;border:none;
            color:var(--text-dim);font-size:14px;font-weight:600;
            cursor:pointer;transition:all 0.3s;font-family:inherit
        }
        .trip-btn.active{background:var(--primary);color:white}
        .calc-result{
            background:rgba(255,107,0,0.08);
            border:1px solid rgba(255,107,0,0.2);
            border-radius:16px;padding:24px;text-align:center;display:none
        }
        .calc-result.show{display:block;animation:fadeUp 0.4s ease}
        .result-label{font-size:13px;color:var(--text-dim);margin-bottom:8px}
        .result-price{font-size:40px;font-weight:900;color:var(--primary)}
        .result-detail{font-size:13px;color:var(--text-dim);margin-top:8px}
        .result-note{font-size:11px;color:var(--text-dim);margin-top:12px;opacity:0.7}

        .modal-overlay{
            position:fixed;top:0;left:0;width:100%;height:100%;
            background:rgba(0,0,0,0.8);backdrop-filter:blur(10px);
            z-index:9000;display:none;align-items:center;
            justify-content:center;padding:20px
        }
        .modal-overlay.active{display:flex}
        .modal{
            background:var(--card-bg);border:1px solid var(--card-border);
            border-radius:24px;width:100%;max-width:500px;
            max-height:90vh;overflow-y:auto;position:relative
        }
        .modal-header{
            padding:24px 24px 0;display:flex;align-items:center;
            justify-content:space-between
        }
        .modal-title{font-size:20px;font-weight:800}
        .modal-close{
            width:36px;height:36px;background:rgba(255,255,255,0.1);
            border:none;border-radius:10px;color:white;font-size:18px;
            cursor:pointer;display:flex;align-items:center;justify-content:center
        }
        .modal-body{padding:24px}
        .modal-body .input-group{margin-bottom:16px}
        .modal-body input,
        .modal-body select,
        .modal-body textarea{
            background:rgba(255,255,255,0.05);
            border:1px solid rgba(255,255,255,0.1);
            padding:14px 16px;border-radius:12px;color:white;
            font-size:15px;font-family:inherit;outline:none;
            width:100%;transition:border-color 0.3s
        }
        .modal-body textarea{resize:vertical;min-height:80px}
        .modal-body input:focus,
        .modal-body select:focus,
        .modal-body textarea:focus{border-color:var(--primary)}
        .modal-body select option{background:var(--secondary)}
        .submit-btn{
            width:100%;padding:16px;
            background:linear-gradient(135deg,var(--primary),#FFB800);
            color:white;border:none;border-radius:14px;font-size:16px;
            font-weight:800;cursor:pointer;font-family:inherit;
            display:flex;align-items:center;justify-content:center;
            gap:10px;transition:transform 0.2s;margin-top:8px
        }
        .submit-btn:hover{transform:scale(1.02)}
        .whatsapp-note{
            text-align:center;font-size:12px;color:var(--text-dim);margin-top:12px
        }
        .whatsapp-note span{color:#25D366;font-weight:700}

        .steps-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
            gap:24px;max-width:900px;margin:0 auto
        }
        .step-card{
            text-align:center;padding:32px 20px;background:var(--card-bg);
            border:1px solid var(--card-border);border-radius:20px
        }
        .step-num{
            width:50px;height:50px;background:var(--primary);border-radius:14px;
            display:flex;align-items:center;justify-content:center;
            font-size:22px;font-weight:900;margin:0 auto 16px;
            box-shadow:0 8px 25px var(--primary-glow)
        }
        .step-icon{font-size:36px;margin-bottom:12px}
        .step-title{font-size:16px;font-weight:700;margin-bottom:8px}
        .step-desc{font-size:13px;color:var(--text-dim);line-height:1.5}

        .services-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
            gap:16px;max-width:800px;margin:0 auto
        }
        .service-chip{
            background:var(--card-bg);border:1px solid var(--card-border);
            border-radius:16px;padding:24px 16px;text-align:center;
            transition:transform 0.3s,border-color 0.3s
        }
        .service-chip:hover{transform:translateY(-4px);border-color:var(--primary)}
        .service-chip .icon{font-size:32px;margin-bottom:10px}
        .service-chip .name{font-size:13px;font-weight:600}
        .service-chip.coming{opacity:0.5;position:relative}
        .service-chip.coming::after{
            content:'SOON';position:absolute;top:8px;right:8px;
            background:var(--primary);font-size:8px;font-weight:800;
            padding:3px 6px;border-radius:4px;letter-spacing:1px
        }

        .trust-bar{
            display:flex;gap:20px;justify-content:center;
            flex-wrap:wrap;max-width:800px;margin:0 auto
        }
        .trust-item{
            display:flex;align-items:center;gap:10px;
            background:var(--card-bg);border:1px solid var(--card-border);
            padding:16px 24px;border-radius:16px
        }
        .trust-icon{font-size:28px}
        .trust-text{font-size:14px;font-weight:600}
        .trust-text span{display:block;font-size:11px;color:var(--text-dim);font-weight:400}

        .company-info{max-width:800px;margin:0 auto}
        .info-card{
            background:var(--card-bg);border:1px solid var(--card-border);
            border-radius:20px;padding:32px
        }
        .info-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
            gap:20px
        }
        .info-label{
            font-size:11px;font-weight:700;color:var(--primary);
            text-transform:uppercase;letter-spacing:1px;margin-bottom:6px
        }
        .info-value{font-size:14px;color:var(--text-dim);line-height:1.5}

        .float-cta{
            position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
            z-index:900;display:flex;gap:10px;
            background:rgba(15,15,26,0.95);backdrop-filter:blur(20px);
            padding:10px;border-radius:20px;
            border:1px solid rgba(255,107,0,0.2);
            box-shadow:0 10px 40px rgba(0,0,0,0.5)
        }
        .float-btn{
            display:flex;align-items:center;gap:8px;padding:12px 24px;
            border-radius:14px;font-size:14px;font-weight:700;
            text-decoration:none;transition:transform 0.2s;
            border:none;cursor:pointer;font-family:inherit
        }
        .float-btn:hover{transform:scale(1.05)}
        .float-btn.book{background:var(--primary);color:white}
        .float-btn.call{background:#2196F3;color:white}
        .float-btn.whatsapp{background:#25D366;color:white}
        .float-btn .f-icon{font-size:18px}

        .map-section{max-width:800px;margin:0 auto}
        .map-container{
            border-radius:20px;overflow:hidden;
            border:1px solid var(--card-border);height:300px
        }
        .map-container iframe{
            width:100%;height:100%;border:none;
            filter:grayscale(1) invert(1) contrast(1.2) hue-rotate(180deg)
        }
        .map-address{text-align:center;margin-top:16px;color:var(--text-dim);font-size:14px}
        .map-address a{color:var(--primary);text-decoration:none;font-weight:600}

            text-align:center;padding:40px 20px 100px;

        function renderVehicles() {
            var grid = document.getElementById('vehicleGrid');

                } else {
                    visualContent = '<span class="emoji-fallback">' + v.emoji + '</span>';
                }
                html += '<div class="vehicle-card reveal" onclick="bookVehicle(\'' + v.name + '\')">';
                html += popularTag;

                html += '<div class="vehicle-info">';
                html += '<div class="vehicle-name">' + v.name + '</div>';
                html += '<div class="vehicle-type">' + v.type + ' • Best for: ' + v.best + '</div>';

                html += '<div class="spec"><span>👥</span> ' + v.seats + ' Seats</div>';

                html += '</div>';
                html += '<button class="vehicle-book">📝 Book ' + v.name + '</button>';
                html += '</div>';
                html += '</div>';
            }
            grid.innerHTML = html;
            setTimeout(function() {
                var els = document.querySelectorAll('.reveal:not(.visible)');
                for (var j = 0; j < els.length; j++) {
                    observer.observe(els[j]);
                }
            }, 100);
        }

        var tripType = 'single';

        function setTrip(type, btn) {
            tripType = type;
            var btns = document.querySelectorAll('.trip-btn');

        function calculateFare() {
            var vehicleId = document.getElementById('calcVehicle').value;
            var distance = parseInt(document.getElementById('calcDistance').value);
            var from = document.getElementById('fromCity').value || 'Your City';
            var to = document.getElementById('toCity').value || 'Destination';

            if (!distance || distance < 1) {
                alert('Distance daalo (KM mein) 📏');
                return;
            }

            var vehicle = null;
            for (var i = 0; i < vehicles.length; i++) {
                if (vehicles[i].id === vehicleId) {
                    vehicle = vehicles[i];
                    break;
                }
            }

            var multiplier = 1;
            if (tripType === 'round') {
                multiplier = 2;
            }
            var totalKm = distance * multiplier;
            var fare = totalKm * vehicle.ratePerKm;
            if (fare < vehicle.minCharge) {
                fare = vehicle.minCharge;
            }

            var tripLabel = 'One Way';
            if (tripType === 'round') {
                tripLabel = 'Round Trip';
            }

            var resultEl = document.getElementById('calcResult');
            document.getElementById('resultPrice').textContent = '₹' + fare.toLocaleString('en-IN');
            document.getElementById('resultDetail').textContent = vehicle.name + ' | ' + from + ' → ' + to + ' | ' + totalKm + ' km (' + tripLabel + ') | ₹' + vehicle.ratePerKm + '/km';

            resultEl.classList.add('show');
            resultEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function openModal(vehicleName) {
            document.getElementById('bookingModal').classList.add('active');
            document.body.style.overflow = 'hidden';
            if (vehicleName) {
                var select = document.getElementById('bVehicle');
                for (var i = 0; i < select.options.length; i++) {
                    if (select.options[i].value === vehicleName) {
                        select.options[i].selected = true;
                        break;
                    }
                }
            }
        }

            document.getElementById('bookingModal').classList.remove('active');
            document.body.style.overflow = '';
        }

        function bookVehicle(name) {
            openModal(name);
        }

        document.getElementById('bookingModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();

        function submitBooking(e) {
            e.preventDefault();

            var name = document.getElementById('bName').value.trim();
            var phone = document.getElementById('bPhone').value.trim();
            var vehicle = document.getElementById('bVehicle').value;

            var date = document.getElementById('bDate').value;
            var trip = document.getElementById('bTrip').value;
            var note = document.getElementById('bNote').value.trim();

            if (!name || !phone || !vehicle || !route || !date) {
                alert('Sab fields bharo bhai! 🙏');
                return;
            }

            var dateObj = new Date(date);
            var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
            var formattedDate = dateObj.getDate() + ' ' + months[dateObj.getMonth()] + ' ' + dateObj.getFullYear();

            var msg = '🚗 *NEW BOOKING — GURU KRIPA TRAVELS*\n';
            msg += '━━━━━━━━━━━━━━━━━━\n';
            msg += '👤 *Name:* ' + name + '\n';
            msg += '📱 *Phone:* ' + phone + '\n';
            msg += '🚘 *Vehicle:* ' + vehicle + '\n';
            msg += '📍 *Route:* ' + route + '\n';
            msg += '📅 *Date:* ' + formattedDate + '\n';
            msg += '🔄 *Trip:* ' + trip + '\n';
            if (note) {
                msg += '💬 *Note:* ' + note + '\n';
            }
            msg += '━━━━━━━━━━━━━━━━━━\n';
            msg += '_via Guru Kripa Website_\n';
            msg += '_Booking Form Submission_';

            var encodedMsg = encodeURIComponent(msg);
            var waURL = 'https://wa.me/' + CONFIG.whatsapp + '?text=' + encodedMsg;

            closeModal();
            var successEl = document.getElementById('successOverlay');
            successEl.classList.add('active');

            setTimeout(function() {
                successEl.classList.remove('active');
                window.open(waURL, '_blank');
            }, 1800);

            document.getElementById('bookingForm').reset();
        }

        window.addEventListener('load', function() {
            setTimeout(function() {
                document.getElementById('loader').classList.add('hidden');
            }, 800);
        });

        window.addEventListener('scroll', function() {
            if (window.scrollY > 50) {
                document.getElementById('nav').classList.add('scrolled');
            } else {
                document.getElementById('nav').classList.remove('scrolled');
            }
        });

        function animateCounter() {
            var el = document.getElementById('counterTrips');
            var target = 5000;
            var current = 0;
            var step = Math.ceil(target / 60);
            var timer = setInterval(function() {
                current += step;
                if (current >= target) {
                    current = target;
                    clearInterval(timer);
                }
                el.textContent = current.toLocaleString() + '+';
            }, 30);
        }
        setTimeout(animateCounter, 1200);

        var observer = new IntersectionObserver(function(entries) {
            for (var i = 0; i < entries.length; i++) {
                if (entries[i].isIntersecting) {
                    entries[i].target.classList.add('visible');
                }
            }
        }, { threshold: 0.1 });

        });
